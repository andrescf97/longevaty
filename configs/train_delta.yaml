wandb:
  dry_run: False
  project_name: "longitudinal_delta_training"
  task: "auprc_6years_training"
  entity: "ge29jil-technical-university-of-munich"

data:
  features_train: "/vol/miltank/projects/practical_wise2526/lung_cancer_lft/adlm_lft/longitudinal/extracted_features/registered_features/max_pool/train_reg_max_pool.pt"
  json_train: "/vol/miltank/projects/practical_wise2526/lung_cancer_lft/data/derived_datasets/train.json"
  features_dev: "/vol/miltank/projects/practical_wise2526/lung_cancer_lft/adlm_lft/longitudinal/extracted_features/registered_features/max_pool/dev_reg_max_pool.pt"
  json_dev: "/vol/miltank/projects/practical_wise2526/lung_cancer_lft/data/derived_datasets/dev.json"
  max_seq_len: 3
  oversample_max_repetition: 1
  augment_train: True

model:
  input_dim: 2376 
  hidden_dim: 256 
  num_time_bins: 6
  dropout: 0.5
  num_heads: 4

loss:
  lambda_mean: 0.1
  lambda_var: 0.05

training:
  batch_size: 128
  epochs: 5000
  warmup_epochs: 10
  lr: 1e-5
  weight_decay: 1e-2
  patience: 200
  metric: "val_auprc"
  mode: "max"
  sched_factor: 0.95
  sched_patience: 30

log:
  output_dir: "/vol/miltank/projects/practical_wise2526/lung_cancer_lft/adlm_lft/longitudinal/delta/checkpoints/29-01-26_auprc_6years"